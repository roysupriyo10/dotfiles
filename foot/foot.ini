# -*- conf -*-
# Linux/Sway — mirrors kitty/kitty.conf + kitty/linux.conf (no agent paste / remote control).

font=monospace:size=16
font-bold=monospace:style=Bold:size=16
font-italic=monospace:style=Italic:size=16
font-bold-italic=monospace:style=Bold Italic:size=16

# kitty: modify_font cell_width 95% / cell_height 8px
letter-spacing=-1px
line-height=24px
vertical-letter-offset=0px

dpi-aware=no
pad=0x0
resize-delay-ms=100

# theme.ini is a per-appearance symlink (-> themes/dark.ini / themes/light.ini)
# that only sets initial-color-theme for new windows; both palettes live below.
# Running windows are switched by appearance-sync (SIGUSR1 dark / SIGUSR2 light).
include=~/.config/foot/theme.ini

[security]
osc52=enabled

[scrollback]
lines=100000
# kitty linux: touch_scroll_multiplier 4.0 (sway scroll_factor 0.25)
multiplier=4.0

[cursor]
style=block
blink=no

[colors-dark]
background=121212
alpha=0.85
blur=no

# Gruvbox Light (medium contrast) — mirrors kitty/themes/light.conf
[colors-light]
background=fbf1c7
foreground=3c3836
alpha=0.85
blur=no
cursor=fbf1c7 3c3836
selection-background=d5c4a1
selection-foreground=3c3836
urls=076678
regular0=fbf1c7
regular1=cc241d
regular2=98971a
regular3=d79921
regular4=458588
regular5=b16286
regular6=689d6a
regular7=7c6f64
bright0=928374
bright1=9d0006
bright2=79740e
bright3=b57614
bright4=076678
bright5=8f3f71
bright6=427b58
bright7=3c3836

[key-bindings]
# OSC 7 from shell → new window in cwd (local only; not kitten-ssh host reuse)
spawn-terminal=Control+Shift+n Control+Shift+t
