# -*- conf -*-
# Linux/Sway — mirrors kitty/kitty.conf + kitty/linux.conf (no agent paste / remote control).

font=monospace:size=16
font-bold=monospace:style=Bold:size=16
font-italic=monospace:style=Italic:size=16
font-bold-italic=monospace:style=Bold Italic:size=16

# kitty: modify_font cell_width 95% / cell_height 8px
letter-spacing=-1px
line-height=24px
vertical-letter-offset=0px

dpi-aware=no
pad=0x0
resize-delay-ms=100

[security]
osc52=enabled

[scrollback]
lines=100000
# kitty linux: touch_scroll_multiplier 4.0 (sway scroll_factor 0.25)
multiplier=4.0

[cursor]
style=block
blink=no

[colors-dark]
alpha=1.0
blur=no

[key-bindings]
# OSC 7 from shell → new window in cwd (local only; not kitten-ssh host reuse)
spawn-terminal=Control+Shift+n Control+Shift+t
