# os.toml    per-platform symlink (-> macos.toml / linux.toml), created by install.
# theme.toml per-appearance symlink (-> themes/dark.toml / themes/light.toml),
#            seeded by install and repointed live by appearance-sync.
# Alacritty watches imports, so repointing either symlink applies instantly.
[general]
import = ["~/.config/alacritty/os.toml", "~/.config/alacritty/theme.toml"]

# opacity is per-theme (themes/*.toml).
[window]
decorations = "none"

# OSC 52 clipboard over SSH. Alacritty defaults to "OnlyCopy" (writes allowed,
# reads blocked); kitty (clipboard_control) and foot ([security] osc52) both allow
# reads, so this keeps nvim's OSC 52 paste working identically across all three.
[terminal]
osc52 = "CopyPaste"

[scrolling]
history = 100000

[cursor]
unfocused_hollow = true

[cursor.style]
shape = "Block"
blinking = "Never"
