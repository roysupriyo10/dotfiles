# macOS-specific kitty settings

editor nvim

tab_bar_style powerline

window_border_width 1

font_size 22

# BEGIN_KITTY_FONTS
font_family      family="IosevkaTerm Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

modify_font cell_width 95%
modify_font cell_height 0px
modify_font baseline 2

# cmd+t / cmd+n: plain local session, home dir. Under kitten ssh, --cwd=current
# follows onto the remote host — these are the escape hatch back to a local shell.
# kitty_mod (ctrl+shift) +t/+n: inherit cwd, and the remote host under kitten ssh.
map cmd+t new_tab
map cmd+n new_os_window
map kitty_mod+t launch --type=tab --cwd=current
map kitty_mod+n launch --type=os-window --cwd=current

# image → agent chat in kitty (Cursor CLI / Claude Code). Ctrl+V. GUI → use VNC.
map kitty_mod+alt+v remote_control_script ~/.local/bin/cursor-clip-paste
