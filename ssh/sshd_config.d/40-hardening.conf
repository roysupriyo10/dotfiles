# Managed by dotfiles (install/lib/ssh.sh) — edit in the repo, not in /etc.
#
# sshd uses the FIRST value it sees for each keyword, so lower-numbered
# drop-ins already on the host keep winning over this file.

# Keys only.
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
HostbasedAuthentication no
IgnoreRhosts yes
PermitRootLogin no
PermitUserEnvironment no
StrictModes yes
RequiredRSASize 3072

# Unauthenticated connections: less time, fewer guesses, fewer slots.
LoginGraceTime 30
MaxAuthTries 4
MaxStartups 10:30:60
PerSourceMaxStartups 5

# Unused attack surface. TCP / agent forwarding are left at their defaults.
X11Forwarding no
PermitTunnel no
GatewayPorts no

# Drop legacy crypto from the defaults ("-" removes, so newer algorithms that
# future OpenSSH releases add stay enabled).
KexAlgorithms -ecdh-sha2-nistp*
MACs -hmac-sha1*,umac-64*,hmac-sha2-256,hmac-sha2-512,umac-128@openssh.com

# Log the key fingerprint used for each login.
LogLevel VERBOSE
