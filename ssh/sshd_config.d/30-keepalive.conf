# Managed by dotfiles (install/lib/ssh.sh) — edit in the repo, not in /etc.
#
# Keep idle sessions alive and ride out short network drops.
#
# ClientAlive probes travel inside the encrypted channel, so NAT / firewall
# state never goes idle. CountMax is deliberately huge: sshd itself should
# never be the one to give up on a quiet peer.
ClientAliveInterval 60
ClientAliveCountMax 1440

# Kernel keepalives tear the session down when a route is only temporarily
# gone; ClientAlive above already does the job.
TCPKeepAlive no
