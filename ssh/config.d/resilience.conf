# Managed by dotfiles (install/lib/ssh.sh) — edit in the repo, not in ~/.ssh.
#
# Included from the END of ~/.ssh/config, and ssh uses the FIRST value it sees
# for each keyword, so anything set in ~/.ssh/config itself wins over this.
ServerAliveInterval 30
ServerAliveCountMax 120
TCPKeepAlive no
ConnectTimeout 15
ConnectionAttempts 3
