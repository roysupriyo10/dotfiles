# Light — Gruvbox Light colours on the rose-pine status layout.
# Selected via ~/.config/tmux/theme.conf (symlink managed by appearance-sync,
# which re-sources tmux.conf so the plugin re-applies). Layout options stay in
# tmux.conf; only the variant + palette live here.
set -g @rose_pine_variant 'dawn'
set -g @rose_pine_color_base    '#fbf1c7'
set -g @rose_pine_color_surface '#ebdbb2'
set -g @rose_pine_color_overlay '#d5c4a1'
set -g @rose_pine_color_muted   '#928374'
set -g @rose_pine_color_subtle  '#7c6f64'
set -g @rose_pine_color_text    '#3c3836'
set -g @rose_pine_color_love    '#9d0006'
set -g @rose_pine_color_gold    '#b57614'
set -g @rose_pine_color_rose    '#af3a03'
set -g @rose_pine_color_pine    '#076678'
set -g @rose_pine_color_foam    '#427b58'
set -g @rose_pine_color_iris    '#8f3f71'
set -g @rose_pine_color_hl_low  '#f2e5bc'
set -g @rose_pine_color_hl_med  '#d5c4a1'
set -g @rose_pine_color_hl_high '#bdae93'
