# Dark — Gruvbox Dark colours on the rose-pine status layout.
# Selected via ~/.config/tmux/theme.conf (symlink managed by appearance-sync,
# which re-sources tmux.conf so the plugin re-applies). Layout options stay in
# tmux.conf; only the variant + palette live here.
set -g @rose_pine_variant 'moon'
set -g @rose_pine_color_base    '#282828'
set -g @rose_pine_color_surface '#3c3836'
set -g @rose_pine_color_overlay '#504945'
set -g @rose_pine_color_muted   '#928374'
set -g @rose_pine_color_subtle  '#a89984'
set -g @rose_pine_color_text    '#ebdbb2'
set -g @rose_pine_color_love    '#fb4934'
set -g @rose_pine_color_gold    '#fabd2f'
set -g @rose_pine_color_rose    '#fe8019'
set -g @rose_pine_color_pine    '#83a598'
set -g @rose_pine_color_foam    '#8ec07c'
set -g @rose_pine_color_iris    '#d3869b'
set -g @rose_pine_color_hl_low  '#32302f'
set -g @rose_pine_color_hl_med  '#504945'
set -g @rose_pine_color_hl_high '#665c54'
